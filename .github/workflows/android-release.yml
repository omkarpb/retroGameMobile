name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android version code
        required: true
        type: number
      
      version_name:
        description: User-facing version name
        required: true
        type: string

jobs:
  build-android:
    name: Build Signed Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore React Native Audio API binaries
        run: |
          mkdir -p /tmp/rnaa-android-libs

          curl -fL \
            "https://github.com/software-mansion-labs/rn-audio-libs/releases/download/v3.1.0/android.zip" \
            -o /tmp/rnaa-android-libs/android.zip

          mkdir -p \
            node_modules/react-native-audio-api/common/cpp/audioapi/external

          unzip -o \
            /tmp/rnaa-android-libs/android.zip \
            -d node_modules/react-native-audio-api/common/cpp/audioapi/external

          rm -rf \
            node_modules/react-native-audio-api/common/cpp/audioapi/external/__MACOSX

          test -f \
            node_modules/react-native-audio-api/common/cpp/audioapi/external/android/arm64-v8a/libopusfile.a

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Restore Android signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/retro-game-upload-key.keystore

      - name: Build signed Android AAB
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: retro-game-upload-key.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PVERSION_CODE=${{ inputs.version_code }} \
            -PVERSION_NAME=${{ inputs.version_name }}
            
      - name: Deploy to Google Play Internal Testing
        working-directory: android
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal

      - name: Upload Android AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          archive: false
          if-no-files-found: error